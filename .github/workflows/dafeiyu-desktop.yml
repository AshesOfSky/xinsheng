name: Build DaFeiYu Desktop
on:
  push:
    branches: [wechat-probe]
    tags: ['dafeiyu-v0.2.4']
    paths: ['wechat-agy/**', '.github/workflows/dafeiyu-desktop.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: wechat-agy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Install build dependencies
        run: python -m pip install -r requirements.txt pyinstaller==6.22.3
      - name: Test, package and smoke test the executable
        shell: pwsh
        run: ./build.ps1 -Python (Get-Command python).Source
      - uses: actions/upload-artifact@v4
        with:
          name: DaFeiYu-Windows-x64-v0.2.4
          path: wechat-agy/release/DaFeiYu-Windows-x64-v0.2.4.zip
          retention-days: 30
      - name: Publish tagged release
        if: github.ref == 'refs/tags/dafeiyu-v0.2.4'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --repo $env:GITHUB_REPOSITORY --draft --title "大肥鱼桌面版 $tag" --notes-file RELEASE_NOTES.md
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          gh release upload $tag release/DaFeiYu-Windows-x64-v0.2.4.zip --repo $env:GITHUB_REPOSITORY
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          gh release edit $tag --repo $env:GITHUB_REPOSITORY --draft=false
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
