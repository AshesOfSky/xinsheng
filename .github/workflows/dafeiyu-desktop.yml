name: Build DaFeiYu Desktop
on:
  push:
    branches: [wechat-probe]
    paths: ['wechat-agy/**', '.github/workflows/dafeiyu-desktop.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: wechat-agy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Install build dependencies
        run: python -m pip install -r requirements.txt pyinstaller==6.22.3
      - name: Test, package and smoke test the executable
        shell: pwsh
        run: ./build.ps1 -Python (Get-Command python).Source
      - uses: actions/upload-artifact@v4
        with:
          name: DaFeiYu-Windows-x64-v0.2.0
          path: wechat-agy/release/DaFeiYu-Windows-x64-v0.2.0.zip
          retention-days: 30
